<header class="top">
  <h1>Pokédex Team Builder</h1>
  <p>Explora Pokémon con PokéAPI y arma tu equipo de 6.</p>
</header>

<main class="layout">
  <app-explorer (pick)="selected.set($event)" />
  <div class="side">
    <app-detail [id]="selected()" (pick)="selected.set($event)" />
    <app-team-panel (pick)="selected.set($event)" />
  </div>
</main>
